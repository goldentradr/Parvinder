
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09070d">
  <title>Singh Trader | Parvinder Singh</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      padding: 25px 16px;
      background:
        radial-gradient(ellipse at 15% 5%, #55204e 0%, transparent 36%),
        radial-gradient(ellipse at 90% 30%, #47204c 0%, transparent 35%),
        linear-gradient(160deg, #100b17, #08070c 60%, #180b1d);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    .brand {
      font-size: clamp(30px, 8vw, 39px);
      font-weight: 900;
      letter-spacing: 1px;
      margin: 12px 0 8px;
      background: linear-gradient(
        90deg, #ffd776, #ff68a8, #bd78ff, #ffd776
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #e7d9ee;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .profile-card {
      margin: 22px auto;
      padding: 23px 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.045);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .story-link {
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 13px;
      -webkit-tap-highlight-color: transparent;
    }

    .story-ring {
      width: 156px;
      height: 156px;
      padding: 5px;
      border-radius: 50%;
      background: conic-gradient(
        #ffd776,
        #ff9b45,
        #ff3d83,
        #c135d9,
        #7048ff,
        #ff3d83,
        #ffd776
      );
      box-shadow:
        0 0 14px rgba(225, 65, 177, 0.35),
        0 0 28px rgba(255, 133, 66, 0.12);
      transition: transform 0.2s ease;
    }

    .story-link:active .story-ring {
      transform: scale(0.96);
    }

    .story-inner {
      width: 100%;
      height: 100%;
      padding: 4px;
      border-radius: 50%;
      background: #100b17;
    }

    .photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 2px solid #100b17;
    }

    .profile-name {
      font-size: 19px;
      font-weight: 800;
      margin: 5px 0 7px;
      color: #fff;
    }

    .profile-caption {
      color: #cbbad6;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .join {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 12px;
      border-radius: 13px;
      text-decoration: none;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(
        100deg, #833ab4, #e1306c, #f77737
      );
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 5px 22px rgba(193, 53, 132, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .join:active {
      transform: scale(0.98);
      filter: brightness(1.15);
    }

    .join svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .trust {
      margin: 25px 0;
      padding: 20px 13px;
      border: 1px solid rgba(205, 119, 255, 0.28);
      border-radius: 16px;
      background: rgba(137, 70, 170, 0.08);
      color: #d9c9e5;
      line-height: 1.8;
      font-size: 13px;
    }

    .trust strong {
      display: block;
      color: #ffcf86;
      font-size: 17px;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .footer {
      margin-top: 25px;
      padding: 17px 5px;
      color: #bba9c8;
      font-size: 12px;
      line-height: 2;
      letter-spacing: 1px;
    }

    .footer strong {
      display: block;
      color: #ffb1d1;
      font-size: 16px;
    }

    @media (max-width: 360px) {
      .story-ring {
        width: 136px;
        height: 136px;
      }

      .profile-card {
        padding: 19px 10px;
      }
    }
  </style>
</head>

<body>

        </svg>
        JOIN NOW

    <section class="trust">

    <section class="profile-card">

      <a class="story-link"
         href="https://t.me/+7TPmvjbhxik4ODdl"
         target="_blank"
         rel="noopener noreferrer"

        <div class="story-ring">
          <div class="story-inner">
            <img class="photo"
                 src="bottom.jpg"

      <h2 class="profile-name">PARVINDER SINGH</h2>
      <p class="profile-caption">Follow the community on Telegram</p>

      <a class="join"
         href="https://t.me/+7TPmvjbhxik4ODdl"
         target="_blank"
         rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.7 2.3a1.2 1.2 0 0 0-1.3-.2L2.2 9.2c-1.2.5-1.1 2.2.2 2.6l4.8 1.5 1.8 5.6c.4 1.1 1.8 1.3 2.5.4l2.7-3.3 4.7 3.5c.9.7 2.2.2 2.4-.9l2.5-14.9a1.4 1.4 0 0 0-.1-1.4ZM9 12.8l8.9-6.3-7.2 7.7-.3 2.7L9 12.8Z"/>
        </svg>

    </section>

    <footer class="footer">

    </footer>

  </main>
</body>
</html>
