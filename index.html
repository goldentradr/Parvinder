<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080706">
  <title>Singh Trader | Parvinder Singh</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      text-align: center;
      min-height: 100vh;
      padding: 22px 14px;
      background:
        radial-gradient(ellipse at top, #3b1010 0%, #241709 25%,
        #100d09 48%, #050505 78%);
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    .brand {
      font-size: clamp(32px, 8vw, 43px);
      font-weight: 900;
      letter-spacing: 2px;
      margin: 10px 0 6px;
      background: linear-gradient(90deg, #fff0ad, #d9a52e, #fff0ad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px rgba(218, 165, 46, 0.18);
    }

    .subtitle {
      color: #e9d9b1;
      font-size: 14px;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
    }

    .photo {
      width: 100%;
      display: block;
      height: auto;
      object-fit: contain;
      border-radius: 15px;
      border: 1px solid rgba(222, 174, 65, 0.65);
      box-shadow: 0 0 22px rgba(212, 160, 44, 0.17);
      margin: 16px auto;
    }

    .join {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 16px 12px;
      margin: 18px auto;
      border-radius: 12px;
      text-decoration: none;
      color: #160d03;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(100deg, #f9e4a0, #d9a52e, #f9e4a0);
      border: 1px solid #ffdf79;
      box-shadow: 0 0 18px rgba(230, 175, 48, 0.25);
      animation: glow 2s infinite alternate;
    }

    .join svg {
      width: 23px;
      height: 23px;
      fill: #160d03;
      flex-shrink: 0;
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 10px rgba(230, 175, 48, 0.18);
      }
      to {
        box-shadow: 0 0 25px rgba(230, 175, 48, 0.48);
      }
    }

    .trust {
      margin: 22px 0;
      padding: 17px 10px;
      border: 1px solid rgba(218, 165, 46, 0.4);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      color: #e7d5a7;
      line-height: 1.8;
      font-size: 14px;
    }

    .trust strong {
      display: block;
      color: #f0c75e;
      font-size: 19px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .timer-box {
      margin: 22px 0;
      padding: 19px 10px;
      background: rgba(70, 0, 0, 0.18);
      border: 1px solid rgba(255, 55, 55, 0.55);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.12);
    }

    .timer-label {
      color: #ff7777;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 9px;
    }

    .timer {
      color: #ff2929;
      font-size: clamp(38px, 10vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 9px rgba(255, 0, 0, 0.8),
                   0 0 23px rgba(255, 0, 0, 0.35);
      font-variant-numeric: tabular-nums;
    }

    .footer {
      margin-top: 24px;
      padding: 16px 5px;
      color: #bba978;
      font-size: 12px;
      line-height: 2;
      letter-spacing: 1.5px;
    }

    .footer strong {
      display: block;
      color: #e6bb54;
      font-size: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">

    <h1 class="brand">SINGH TRADER 👑</h1>
    <p class="subtitle">WELCOME TO OUR TRADING COMMUNITY</p>

    <!-- Upload your first photo as top.jpg -->
    <img
      class="photo"
      src="top.jpg"
      alt="Singh Trader"
    >

    <a
      class="join"
      href="https://t.me/+7TPmvjbhxik4ODdl"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.7 2.3a1.2 1.2 0 0 0-1.3-.2L2.2 9.2c-1.2.5-1.1 2.2.2 2.6l4.8 1.5 1.8 5.6c.4 1.1 1.8 1.3 2.5.4l2.7-3.3 4.7 3.5c.9.7 2.2.2 2.4-.9l2.5-14.9a1.4 1.4 0 0 0-.1-1.4ZM9 12.8l8.9-6.3-7.2 7.7-.3 2.7L9 12.8Z"/>
      </svg>
      JOIN TELEGRAM NOW
    </a>

    <section class="trust">
      <strong>✦ JOIN SINGH TRADER ✦</strong>
      Learn, connect and stay updated with our community.
    </section>

    <section class="timer-box">
      <p class="timer-label">⏳ OFFER ENDS IN</p>
      <div class="timer" id="countdown">00:00:30</div>
    </section>

    <!-- Upload your second photo as bottom.jpg -->
    <img
      class="photo"
      src="bottom.jpg"
      alt="Parvinder Singh"
    >

    <a
      class="join"
      href="https://t.me/+7TPmvjbhxik4ODdl"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.7 2.3a1.2 1.2 0 0 0-1.3-.2L2.2 9.2c-1.2.5-1.1 2.2.2 2.6l4.8 1.5 1.8 5.6c.4 1.1 1.8 1.3 2.5.4l2.7-3.3 4.7 3.5c.9.7 2.2.2 2.4-.9l2.5-14.9a1.4 1.4 0 0 0-.1-1.4ZM9 12.8l8.9-6.3-7.2 7.7-.3 2.7L9 12.8Z"/>
      </svg>
      JOIN TELEGRAM NOW
    </a>

    <footer class="footer">
      <strong>SINCE 2018</strong>
      Parvinder Singh
    </footer>

  </main>

  <script>
    let seconds = 30;
    const countdown = document.getElementById("countdown");

    function updateCountdown() {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;

      countdown.textContent =
        "00:" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");

      if (seconds > 0) {
        seconds--;
      } else {
        clearInterval(timerInterval);
      }
    }

    updateCountdown();
    const timerInterval = setInterval(updateCountdown, 1000);

    document.querySelectorAll("img").forEach(function (img) {
      img.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });

      img.addEventListener("dragstart", function (event) {
        event.preventDefault();
      });
    });
  </script>
</body>
</html>
